name: Build Pseudo 3D demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pseudo 3D demo
        uses: actions/checkout@v4
        with:
          repository: Stalis/pseudo-3d-js
          path: pseudo-3d-js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: pseudo-3d-js/yarn.lock
      - name: Build demo
        run: |
          corepack enable
          yarn --cwd pseudo-3d-js install --frozen-lockfile
          yarn --cwd pseudo-3d-js build
      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-3d-js
          path: pseudo-3d-js/dist
          retention-days: 1
